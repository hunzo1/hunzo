<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hunzo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #000000;
            --bg2: #0a0a0a;
            --bg3: #111111;
            --bg4: #1a1a1a;
            --border: #1f1f1f;
            --border2: #2a2a2a;
            --border3: #333333;
            --text: #ededed;
            --text2: #a1a1a1;
            --text3: #666666;
            --accent: #5b63f5;
            --accent-hover: #4c54e8;
            --accent-glow: rgba(91,99,245,0.12);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --radius: 8px;
            --radius-sm: 5px;
            --radius-lg: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }

        /* NAV */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }

        .nav-logo-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
}

        .logo-spark {
            animation: spark-breathe 2s ease-out forwards;
            transform-origin: center;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
}

        @keyframes spark-breathe {
            0%   { transform: scale(0.6); opacity: 0; filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
            50%  { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
            75%  { transform: scale(0.95); filter: drop-shadow(0 0 4px rgba(255,255,255,0.3)); }
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.25)); }
}
        .nav-logo-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #ffffff;
}

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-link {
            font-size: 13px;
            color: var(--text2);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
            font-weight: 400;
        }

        .nav-link:hover { color: var(--text); background: var(--bg3); }
        .nav-link.active { color: var(--text); }

        .nav-btn {
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover { opacity: 0.85; }

        .nav-btn-ghost {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border3);
        }

        .nav-btn-ghost:hover {
            opacity: 1;
            color: var(--text);
            border-color: var(--text3);
            background: var(--bg3);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-white {
            background: var(--text);
            color: var(--bg);
        }

        .btn-white:hover { opacity: 0.85; }

        .btn-ghost {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border3);
        }

        .btn-ghost:hover { color: var(--text); border-color: var(--text3); background: var(--bg3); }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.3);
        }

        .btn-danger:hover { background: rgba(239,68,68,0.1); }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-lg { padding: 12px 24px; font-size: 14px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-full { width: 100%; }

        /* INPUTS */
        .input {
            width: 100%;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        .input:focus { border-color: var(--accent); }
        .input::placeholder { color: var(--text3); }

        .input-mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .form-group { margin-bottom: 16px; }

        /* CARDS */
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .card-sm { padding: 16px; border-radius: var(--radius); }

        /* BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .badge-green { background: rgba(34,197,94,0.12); color: var(--success); }
        .badge-yellow { background: rgba(245,158,11,0.12); color: var(--warning); }
        .badge-red { background: rgba(239,68,68,0.12); color: var(--danger); }
        .badge-blue { background: rgba(59,130,246,0.12); color: var(--info); }
        .badge-purple { background: var(--accent-glow); color: #818cf8; }
        .badge-gray { background: var(--bg3); color: var(--text2); }

        /* ALERTS */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; }
        .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); color: #86efac; }
        .alert-show { display: block; }

        /* DIVIDER */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        /* CONTAINERS */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .container-sm { max-width: 480px; margin: 0 auto; padding: 0 24px; }
        .container-md { max-width: 720px; margin: 0 auto; padding: 0 24px; }

        /* PAGE HEADER */
        .page-header {
            padding: 32px 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text2);
        }

        /* SIDEBAR LAYOUT */
        .app-layout {
            display: flex;
            min-height: calc(100vh - 56px);
        }

        .sidebar {
            width: 220px;
            min-width: 220px;
            border-right: 1px solid var(--border);
            padding: 16px 12px;
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            overflow-y: auto;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 8px;
            margin-bottom: 6px;
            margin-top: 20px;
        }

        .sidebar-label:first-child { margin-top: 0; }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text2);
            text-decoration: none;
            transition: all 0.15s;
            font-weight: 400;
        }

        .sidebar-link:hover { color: var(--text); background: var(--bg3); }
        .sidebar-link.active { color: var(--text); background: var(--bg3); font-weight: 500; }

        .sidebar-icon { font-size: 14px; width: 18px; text-align: center; }

        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text3);
            margin-top: 4px;
        }

        /* TABLE */
        .table-wrap {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            font-size: 11px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 12px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        td {
            font-size: 13px;
            color: var(--text2);
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--bg2); color: var(--text); }

        .score-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 24px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        /* SPINNER */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
